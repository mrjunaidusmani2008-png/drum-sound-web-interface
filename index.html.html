<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔊🔊🎶🎶🎵🥁🥁🥁Drum📼📼Player🥁🥁🥁🎶🎶🎵🔊🔊</title>
    <link rel="stylesheet" href="style.css.css">
</head>
<body>
    
    <div class="container">

    <div class="header">
        <h1>BEAT STUDIO</h1>
        <p>Virtual Drum Machine</p>
    </div>

    <div class="drum-container">

        <button class="drum-pad" onclick="playKick()" data-key="a">
            <span class="key">A</span>
            <span class="sound">KICK</span>
        </button>

        <button class="drum-pad" data-key="s">
            <span class="key">S</span>
            <span class="sound">SNARE</span>
        </button>

        <button class="drum-pad" data-key="d">
            <span class="key">D</span>
            <span class="sound">HI-HAT</span>
        </button>

        <button class="drum-pad" data-key="f">
            <span class="key">F</span>
            <span class="sound">TOM</span>
        </button>

        <button class="drum-pad" data-key="g">
            <span class="key">G</span>
            <span class="sound">CRASH</span>
        </button>

        <button class="drum-pad" data-key="h">
            <span class="key">H</span>
            <span class="sound">CLAP</span>
        </button>

    </div>

    <div class="footer">
        PRESS YOUR KEYBOARD TO CREATE MUSIC
    </div>

</div>
<script src="Script.js.js">
    
</script>
    
</body>
</html>
